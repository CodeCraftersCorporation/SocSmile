<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SocSmile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Soc<span>Smile</span></h1>
        <p class="subtitle">Рады видеть вас снова!</p>

        <div id="alert" class="alert" style="display:none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" class="form-control" placeholder="your_username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Войти →</button>
        </form>

        <p class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
        const result = await api.login(username, password);
        if (result.success) {
            auth.setSession(result.token, result);
            window.location.href = 'feed.html';
        } else {
            showAlert('Неверное имя пользователя или пароль', 'error');
        }
    } catch (err) {
        showAlert('Ошибка подключения: ' + err.message, 'error');
    }
});

function showAlert(message, type) {
    const alert = document.getElementById('alert');
    alert.textContent = message;
    alert.className = 'alert alert-' + type;
    alert.style.display = 'block';
    setTimeout(() => alert.style.display = 'none', 4000);
}
</script>
</body>
</html>
