<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — SocSmile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Soc<span>Smile</span></h1>
        <p class="subtitle">Создайте свой аккаунт</p>

        <div id="alert" class="alert" style="display:none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" class="form-control" placeholder="your_username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="displayName">Отображаемое имя</label>
                <input type="text" id="displayName" class="form-control" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" placeholder="Минимум 3 символа" required minlength="3">
            </div>
            <div class="form-group">
                <label for="passwordConfirm">Подтвердите пароль</label>
                <input type="password" id="passwordConfirm" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт ✨</button>
        </form>

        <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const displayName = document.getElementById('displayName').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;

    if (password !== passwordConfirm) {
        showAlert('Пароли не совпадают', 'error');
        return;
    }

    try {
        const result = await api.register(username, password, displayName);
        if (result.success) {
            auth.setSession(result.token, result);
            window.location.href = 'feed.html';
        } else {
            showAlert(result.error || 'Ошибка регистрации', 'error');
        }
    } catch (err) {
        showAlert('Ошибка подключения: ' + err.message, 'error');
    }
});

function showAlert(message, type) {
    const alert = document.getElementById('alert');
    alert.textContent = message;
    alert.className = 'alert alert-' + type;
    alert.style.display = 'block';
    setTimeout(() => alert.style.display = 'none', 4000);
}
</script>
</body>
</html>
