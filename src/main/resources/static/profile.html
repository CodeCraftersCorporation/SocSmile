<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — SocSmile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<nav class="navbar">
    <a href="feed.html" class="navbar-brand">Soc<span>Smile</span></a>
    <div class="navbar-user">
        <img id="navAvatar" class="navbar-avatar" src="" alt="">
        <span id="navUsername" class="navbar-username"></span>
        <button id="logoutBtn" class="navbar-logout">Выйти</button>
    </div>
</nav>

<div class="container" id="profileContainer">
    <div class="feed-loading">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    auth.requireAuth();
    loadProfile();
    document.getElementById('logoutBtn').addEventListener('click', () => {
        auth.logout();
    });
});

async function loadProfile() {
    const userId = new URLSearchParams(window.location.search).get('id');
    const path = userId ? '/api/profile/' + userId : '/api/profile/me';

    try {
        const data = await api.get(path);
        renderProfile(data);
    } catch (err) {
        document.getElementById('profileContainer').innerHTML =
            '<div class="empty-state"><div class="icon">😕</div><h3>Ошибка загрузки</h3></div>';
    }
}

function renderProfile(data) {
    const user = data.user;
    const posts = data.posts;
    const isMe = !new URLSearchParams(window.location.search).get('id');

    let totalLikes = 0;
    posts.forEach(p => totalLikes += p.likeCount || 0);

    document.getElementById('profileContainer').innerHTML = `
        <div class="my-profile-header">
            <div class="profile-header">
                <img class="profile-avatar" src="${user.avatar}" alt="${user.displayName}">
                <div class="profile-name">${escapeHtml(user.displayName)}</div>
                <div class="profile-username">@${escapeHtml(user.username)}</div>
                ${user.bio ? '<div class="profile-bio">' + escapeHtml(user.bio) + '</div>' : ''}
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="profile-stat-number">${posts.length}</div>
                    <div class="profile-stat-label">Постов</div>
                </div>
                <div class="stat-item">
                    <div class="profile-stat-number">${totalLikes}</div>
                    <div class="profile-stat-label">Лайков</div>
                </div>
                <div class="stat-item">
                    <div class="profile-stat-number">${user.createdAt}</div>
                    <div class="profile-stat-label">С нами с</div>
                </div>
            </div>
        </div>
        <div class="profile-content">
            <div class="profile-tabs">
                <button class="profile-tab active">Посты (${posts.length})</button>
            </div>
            <div id="profilePosts" style="padding: 16px;">
                ${posts.length === 0
                    ? '<div class="empty-state"><div class="icon">📝</div><h3>Пока нет постов</h3></div>'
                    : posts.map(post => renderPostCard(post)).join('')
                }
            </div>
        </div>
    `;

    // Setup like buttons
    document.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleLike(btn));
    });

    // Update navbar
    document.getElementById('navAvatar').src = user.avatar;
    document.getElementById('navUsername').textContent = user.displayName;
}

function renderPostCard(post) {
    const likedClass = post.liked ? 'liked' : '';
    const heartIcon = post.liked ? '❤️' : '🤍';
    const imageHtml = post.imageUrl
        ? `<img src="${escapeHtml(post.imageUrl)}" class="post-image" alt="">`
        : '';

    return `
        <div class="card post-card">
            <div class="post-header">
                <img class="post-avatar" src="${escapeHtml(post.authorAvatar)}" alt="">
                <div>
                    <div class="post-author" onclick="window.location.href='profile.html?id=${post.authorId}'">${escapeHtml(post.authorName)}</div>
                    <div class="post-time">${escapeHtml(post.createdAt)}</div>
                </div>
            </div>
            <div class="post-text">${escapeHtml(post.text)}</div>
            ${imageHtml}
            <div class="post-actions">
                <button class="post-action-btn like-btn ${likedClass}" data-post-id="${post.id}">
                    <span class="heart-icon">${heartIcon}</span>
                    <span>${post.likeCount || 0}</span>
                </button>
            </div>
        </div>
    `;
}

async function toggleLike(btn) {
    const postId = btn.dataset.postId;
    try {
        const data = await api.post('/api/posts/' + postId + '/like', {});
        const likedClass = data.liked ? 'liked' : '';
        const heartIcon = data.liked ? '❤️' : '🤍';
        btn.className = 'post-action-btn like-btn ' + likedClass;
        btn.querySelector('.heart-icon').textContent = heartIcon;
        btn.querySelector('span:last-child').textContent = data.likeCount || 0;
    } catch (err) {
        console.error('Like error:', err);
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
